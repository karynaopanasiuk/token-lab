<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Сторінку не знайдено - Tokens Lab</title>
  <script>
    // Тема виставляється до першого малювання, щоб не було спалаху. За замовчуванням темна.

    document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
  </script>

    <div class="topbar__inner">
      <a class="logo" href="/"><span class="logo__mark" aria-hidden="true"></span>Tokens Lab</a>

  </header>
